name: Docker Build

on:
  push:
    paths:
      - 'docker/**'
  workflow_dispatch:

jobs:
  build:
    name: build · push a GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/albert0fernandez/academia-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SHA corto
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: docker/app
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}

      # Solo se llega aquí si el build anterior ha pasado
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a GHCR
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ steps.vars.outputs.sha_short }}"
